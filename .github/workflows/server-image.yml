name: server-image

# Publishes the self-host server image (#399) so "paste a compose file" hosts
# (Portainer, Hostinger Docker Manager, CasaOS, Synology, …), which never run a
# build step, can install and upgrade with a pull:
#
#   ghcr.io/<owner>/baalda-server:<version>   e.g. 0.1.112
#   ghcr.io/<owner>/baalda-server:latest
#
# <version> is the release version (tauri.conf.json), the number every release
# bumps. A merge to main that did not change it finds the tag already published
# and stops after one cheap check, the same rule release.yml follows. The image
# is exactly app/apps/server/Dockerfile's output: nothing new at runtime.
#
# First publish only: the package starts private. Make it public once in
# GitHub → Packages → baalda-server → Package settings → Change visibility.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: server-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version and image name
        id: meta
        run: |
          version=$(node -p "require('./app/apps/desktop/src-tauri/tauri.conf.json').version")
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/baalda-server" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already published?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" > /dev/null 2>&1; then
            echo "Image ${{ steps.meta.outputs.version }} is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.exists.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip != 'true'

      - name: Build and push (amd64 + arm64)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.description=Baalda sync server (self-host)
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
