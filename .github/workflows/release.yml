name: release

# Cut a release by bumping the version in app/apps/desktop/src-tauri/tauri.conf.json
# (and package.json), then pushing a matching tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# This builds bundles for macOS (arm64 + x64), Linux (x64) and Windows (x64) and
# publishes a GitHub Release with the installers + latest.json (the updater
# manifest). Only macOS is OS-signed; see the matrix note on what that means.
#
# ⚠️ The release goes live as soon as the build finishes — `releases/latest`
# moves to it immediately and running apps pick up the update on their next
# updater poll. There is no review step. Push a `v*` tag only when you mean to
# ship to everyone; set `releaseDraft: true` below if you want a manual gate.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Submit to Apple for notarization (off ships signed-only)'
        type: boolean
        default: true

# ── The notarization switch ───────────────────────────────────────────────────
# Notarizing is part of releasing, not a follow-up. Tauri signs the `.app`,
# submits it to Apple, waits, and staples the returned ticket into the bundle
# before the `.dmg` is built around it — so the app carries its own ticket even
# after the user drags it out of the DMG, and verifies offline. This is how
# essentially every macOS app ships (Zed, Lapce, and ~94 public repos calling
# `notarytool submit --wait` straight from their release job).
#
# The consequence, accepted deliberately: a release is only as fast as Apple's
# notary queue, and if that queue stalls the job fails and NOTHING publishes.
# That is the right failure — a green release carrying a bundle Gatekeeper will
# refuse is worse than no release at all. tauri-action does not create the
# GitHub Release until the build succeeds, so a failed run leaves no wreckage.
#
# This is the master switch for TAG PUSHES; `workflow_dispatch` overrides it via
# the input above.
#
#   yes → sign + notarize (default; a clean install with no Gatekeeper prompt)
#   no  → sign only        (escape hatch: ships while Apple's queue is wedged,
#                           but fresh downloads get the "cannot be verified"
#                           prompt. Auto-update is unaffected either way — the
#                           updater checks our minisign signature, not Apple's
#                           ticket.)
#
# Use the escape hatch by hand — Actions → release → Run workflow →
# `notarize: false` — rather than editing this line, so it can never be left off
# by accident. See docs/RELEASE.md → "When notarization hangs".
env:
  NOTARIZE_ON_TAG: 'yes'

jobs:
  release:
    permissions:
      contents: write
    # No explicit timeout: the job runs to GitHub's 6-hour default, which is as
    # close to "wait for Apple" as a hosted runner allows. Build + sign takes ~7
    # minutes; the rest is Apple's notary queue, and we now know that queue is
    # slow rather than dead.
    #
    # A 120-minute cap used to live here, on the theory that a submission still
    # pending after two hours was wedged forever. v0.1.12 disproved that: the cap
    # killed the aarch64 job at 1h55m and a transient runner DNS error killed the
    # x86_64 one at 1h49m, yet `notarytool history` later showed BOTH submissions
    # Accepted. The cap was throwing away releases Apple was about to approve.
    #
    # Capping this bought nothing anyway — a failed run publishes nothing, so the
    # only thing a short timeout saves is runner minutes, which are free on a
    # public repo. Waiting is strictly better than re-tagging.
    strategy:
      fail-fast: false
      # One at a time, for two reasons now that the matrix is four wide:
      #   1. Both macOS jobs otherwise submit to Apple's notary service
      #      concurrently under the SAME Apple ID — the one unusual thing about
      #      this setup, and it costs nothing to rule out.
      #   2. Every job calls tauri-action, which creates the GitHub Release if it
      #      does not exist yet. Run them in parallel and several race to create
      #      the same tag. Serial means the first job creates it and the rest
      #      upload into it.
      # The cost is wall-clock: a full four-platform release runs ~35-45 min.
      max-parallel: 1
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          # ── What "signed" means per platform ─────────────────────────────────
          # macOS is the only one with real OS signing (Developer ID + notarized
          # + stapled). Linux and Windows ship UNSIGNED, so a fresh download
          # warns: Windows SmartScreen shows "unrecognized app" (More info → Run
          # anyway) and Linux has no signing story to speak of. Fixing Windows
          # means an Authenticode/EV cert in WINDOWS_CERTIFICATE — not wired up.
          #
          # Auto-update is unaffected on every platform: the updater verifies our
          # minisign signature over the bundle, not any OS certificate.
          #
          # Linux is pinned to ubuntu-22.04, NOT ubuntu-latest, on purpose: a
          # binary linked against a newer glibc refuses to start on older
          # distros, so we build on the oldest image that still ships
          # libwebkit2gtk-4.1-dev. That buys Ubuntu 22.04+/Debian 12+ coverage.
          # ⚠️ Dated: GitHub begins deprecating the 22.04 image 2026-09-17 and
          # removes it 2027-04-17 (actions/runner-images#14254). Before then,
          # move to ubuntu-24.04 and accept the higher glibc floor, or build
          # Linux in a container. Bump the `if:` on the deps step to match.

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2's documented Ubuntu prerequisite set, plus patchelf (AppImage).
      # Note webkit2gtk **4.1** and **ayatana**-appindicator: 4.0 and the plain
      # libappindicator3-dev are the Tauri v1 packages and do not link here.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf

      # pnpm must be installed before setup-node: its pnpm cache support
      # shells out to the pnpm binary. The version comes from the
      # packageManager pin in app/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/apps/desktop/src-tauri -> target'

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Resolve the switch once, here, rather than repeating the expression on
      # each step. A tag push reads NOTARIZE_ON_TAG; a manual run reads the input.
      - name: Resolve notarization mode
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            want='${{ inputs.notarize }}'
          else
            want='${{ env.NOTARIZE_ON_TAG == 'yes' }}'
          fi
          echo "notarize=$want" >> "$GITHUB_OUTPUT"
          echo "Notarization: $want"

      # Two steps rather than one with conditional env, deliberately. Blanking
      # APPLE_ID/PASSWORD/TEAM_ID does not reliably disable notarization — a GitHub
      # expression yields an EMPTY STRING, not an unset variable, and "set but
      # empty" is exactly the state the APPLE_CERTIFICATE note below warns about.
      # An `if:` on the whole step cannot misfire.

      - name: Build, sign and notarize
        if: steps.cfg.outputs.notarize == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key (minisign). Generated locally with
          # `tauri signer generate`; add both as repo Actions secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization (see docs/RELEASE.md).
          # All six must be non-empty: an empty APPLE_CERTIFICATE still makes
          # tauri attempt a keychain import and fails the whole macOS build, so
          # comment the block out wholesale rather than blanking a single secret.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app/apps/desktop
          tagName: v__VERSION__
          releaseName: 'Baalda v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Same build, minus the three notarization variables. Tauri logs
      # "skipping app notarization, no APPLE_ID & APPLE_PASSWORD & APPLE_TEAM_ID"
      # and produces a Developer ID signed, hardened-runtime bundle — everything
      # Gatekeeper wants except the notarization ticket. Auto-update is unaffected
      # (it verifies the minisign signature, not Apple's ticket); only fresh
      # downloads prompt, and right-click → Open clears it.
      - name: Build and sign (notarization skipped)
        if: steps.cfg.outputs.notarize != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: app/apps/desktop
          tagName: v__VERSION__
          releaseName: 'Baalda v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
