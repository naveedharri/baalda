name: release

# Cut a release by bumping the version in app/apps/desktop/src-tauri/tauri.conf.json
# (and package.json), then pushing a matching tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# This builds signed, notarized bundles for macOS (arm64 + x64) and publishes a
# GitHub Release with the installers + latest.json (the updater manifest).
# Windows and Linux are commented out of the matrix below — see the note there.
#
# ⚠️ The release goes live as soon as the build finishes — `releases/latest`
# moves to it immediately and running apps pick up the update on their next
# updater poll. There is no review step. Push a `v*` tag only when you mean to
# ship to everyone; set `releaseDraft: true` below if you want a manual gate.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    # Build + sign takes ~7 minutes; Apple's notary service normally answers well
    # inside 15. Without a bound, a wedged `notarytool` sits on the runner until
    # the 6-hour default — v0.1.9 burned 50 minutes before erroring and v0.1.10
    # was still hung at 69 (the runner had to kill the orphan process). Failing
    # at 35 makes a bad notary run cost one coffee instead of an afternoon.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # One at a time. Both macOS jobs otherwise submit to Apple's notary service
      # concurrently under the SAME Apple ID, which is the one unusual thing about
      # this setup and costs nothing to rule out. Serial adds ~7 minutes.
      max-parallel: 1
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # macOS only for now — macOS is the only platform with real OS signing
          # wired up (Developer ID + notarization), so it's the only one we ship.
          # Uncomment to resume Windows/Linux; the Linux dependency step below is
          # already guarded by an `if` and stays inert until then.
          # - platform: 'ubuntu-22.04'
          #   args: ''
          # - platform: 'windows-latest'
          #   args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # pnpm must be installed before setup-node: its pnpm cache support
      # shells out to the pnpm binary. The version comes from the
      # packageManager pin in app/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/apps/desktop/src-tauri -> target'

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key (minisign). Generated locally with
          # `tauri signer generate`; add both as repo Actions secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization (see docs/RELEASE.md).
          # All six must be non-empty: an empty APPLE_CERTIFICATE still makes
          # tauri attempt a keychain import and fails the whole macOS build, so
          # comment the block out wholesale rather than blanking a single secret.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app/apps/desktop
          tagName: v__VERSION__
          releaseName: 'Baalda v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
