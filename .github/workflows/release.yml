name: release

# Cut a release by bumping the version in app/apps/desktop/src-tauri/tauri.conf.json
# (and package.json), then pushing a matching tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# This builds signed, notarized bundles for macOS (arm64 + x64) and publishes a
# GitHub Release with the installers + latest.json (the updater manifest).
# Windows and Linux are commented out of the matrix below — see the note there.
#
# ⚠️ The release goes live as soon as the build finishes — `releases/latest`
# moves to it immediately and running apps pick up the update on their next
# updater poll. There is no review step. Push a `v*` tag only when you mean to
# ship to everyone; set `releaseDraft: true` below if you want a manual gate.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Submit to Apple for notarization (off ships signed-only)'
        type: boolean
        default: true

# ── The notarization switch ───────────────────────────────────────────────────
# Notarization is the ONE step that can wedge a release, and it fails outside our
# control: Apple accepts a submission and then processes it whenever it feels like
# it (see docs/RELEASE.md → "When notarization hangs"). Tauri puts no timeout
# around it, so a stuck submission used to consume the entire job.
#
# This is the master switch for TAG PUSHES. `workflow_dispatch` overrides it via
# the input above.
#
#   yes → sign + notarize inline (ties the release to Apple's queue)
#   no  → sign only, and let notarize.yml staple the DMGs afterwards
#
# ⚠️ Keep this 'no'. It is the intended design, not a workaround: `notarize.yml`
# runs after this workflow, notarizes the published `.dmg` assets and replaces
# them in place once Apple answers. Releases therefore ship in ~7 minutes and a
# notary outage can never block a fix again. Setting it to 'yes' only makes sense
# if you specifically need the DMGs stapled before the release goes public.
env:
  NOTARIZE_ON_TAG: 'no'

jobs:
  release:
    permissions:
      contents: write
    # Build + sign takes ~7 minutes; Apple's notary service normally answers well
    # inside 15. Without a bound, a wedged `notarytool` sits on the runner until
    # the 6-hour default — v0.1.9 burned 50 minutes before erroring and v0.1.10
    # was still hung at 69 (the runner had to kill the orphan process). Failing
    # at 35 makes a bad notary run cost one coffee instead of an afternoon.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # One at a time. Both macOS jobs otherwise submit to Apple's notary service
      # concurrently under the SAME Apple ID, which is the one unusual thing about
      # this setup and costs nothing to rule out. Serial adds ~7 minutes.
      max-parallel: 1
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # macOS only for now — macOS is the only platform with real OS signing
          # wired up (Developer ID + notarization), so it's the only one we ship.
          # Uncomment to resume Windows/Linux; the Linux dependency step below is
          # already guarded by an `if` and stays inert until then.
          # - platform: 'ubuntu-22.04'
          #   args: ''
          # - platform: 'windows-latest'
          #   args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # pnpm must be installed before setup-node: its pnpm cache support
      # shells out to the pnpm binary. The version comes from the
      # packageManager pin in app/package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app/apps/desktop/src-tauri -> target'

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # Resolve the switch once, here, rather than repeating the expression on
      # each step. A tag push reads NOTARIZE_ON_TAG; a manual run reads the input.
      - name: Resolve notarization mode
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            want='${{ inputs.notarize }}'
          else
            want='${{ env.NOTARIZE_ON_TAG == 'yes' }}'
          fi
          echo "notarize=$want" >> "$GITHUB_OUTPUT"
          echo "Notarization: $want"

      # Two steps rather than one with conditional env, deliberately. Blanking
      # APPLE_ID/PASSWORD/TEAM_ID does not reliably disable notarization — a GitHub
      # expression yields an EMPTY STRING, not an unset variable, and "set but
      # empty" is exactly the state the APPLE_CERTIFICATE note below warns about.
      # An `if:` on the whole step cannot misfire.

      - name: Build, sign and notarize
        if: steps.cfg.outputs.notarize == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key (minisign). Generated locally with
          # `tauri signer generate`; add both as repo Actions secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization (see docs/RELEASE.md).
          # All six must be non-empty: an empty APPLE_CERTIFICATE still makes
          # tauri attempt a keychain import and fails the whole macOS build, so
          # comment the block out wholesale rather than blanking a single secret.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app/apps/desktop
          tagName: v__VERSION__
          releaseName: 'Baalda v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Same build, minus the three notarization variables. Tauri logs
      # "skipping app notarization, no APPLE_ID & APPLE_PASSWORD & APPLE_TEAM_ID"
      # and produces a Developer ID signed, hardened-runtime bundle — everything
      # Gatekeeper wants except the notarization ticket. Auto-update is unaffected
      # (it verifies the minisign signature, not Apple's ticket); only fresh
      # downloads prompt, and right-click → Open clears it.
      - name: Build and sign (notarization skipped)
        if: steps.cfg.outputs.notarize != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: app/apps/desktop
          tagName: v__VERSION__
          releaseName: 'Baalda v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
