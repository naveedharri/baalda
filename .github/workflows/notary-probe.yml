name: notary-probe

# TEMPORARY diagnostic. Delete once notarization is settled.
#
# What this established (2026-08-04):
#   * every runner image reaches Apple in <2s, and the credentials authenticate
#   * `notarytool submit` UPLOADS fine — a junk zip gets a submission id
#   * but submissions were not being PROCESSED promptly: 4 of 5 sat "In Progress",
#     two for 20 hours, including a 173-byte file that should be rejected instantly
#
# So the release hang was Apple-side queueing, not signing, credentials, runner
# image, or concurrency — all of which were tested and cleared.
#
# Update (2026-08-05): the queue DRAINED. Every submission above reached a terminal
# state — the junk zips `Invalid`, the real bundles `Accepted`, including both
# v0.1.12 submissions whose release jobs had already been killed for taking too
# long. Slow, never dead. See docs/RELEASE.md → "Slow is not the same as wedged".
#
# Run this FIRST after any notarization failure: if the failed run's submission id
# comes back `Accepted`, the bundle was fine and only the job gave up.
on:
  workflow_dispatch:

jobs:
  history:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Submission queue state
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          perl -e 'alarm 120; exec @ARGV' \
            xcrun notarytool history \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json
          echo "(exit $?)"
