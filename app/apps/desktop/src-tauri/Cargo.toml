[package]
name = "desktop"
version = "0.1.61"
description = "Baalda — local-first markdown app"
authors = ["Baalda"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't conflict with the
# bin name (an issue on Windows — see rust-lang/cargo#8519).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
# Frontend logging: `console.log` in a WKWebView never reaches the `tauri dev`
# terminal, so the UI reports through this plugin's Stdout target instead.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
regex = "1"
once_cell = "1"
# Move a deleted local-workspace folder to the OS trash (recoverable) rather than
# hard-deleting it — the on-disk `.md` files are the only copy of a local vault.
trash = "5"
# OS keychain for session tokens (spec 04 §7). keyring 3 has NO default store:
# every platform's backend must be named as a feature or that platform silently
# falls back to the in-memory `mock` store, so the session token dies with the
# process and the app starts signed out on every launch (#136, #129).
#   apple-native        → macOS Security framework / Keychain
#   windows-native      → Windows Credential Manager
#   sync-secret-service → Linux D-Bus Secret Service (gnome-keyring / KWallet),
#     the only Linux store that survives a reboot — `linux-native` (kernel
#     keyutils) is per-boot memory, so it is not a substitute.
#   crypto-rust         → encrypt the Secret Service D-Bus session with pure
#     Rust rather than plaintext or a system OpenSSL.
# sync-secret-service links libdbus, so Linux CI installs libdbus-1-dev (both
# release workflows) and Linux users need libdbus-1-3 — present on every desktop
# install that has a Secret Service at all.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
tauri-plugin-deep-link = "2.4.9"
# Text extraction from OOXML containers (`extract.rs`): a `.docx`/`.xlsx`/
# `.pptx` is a ZIP of XML parts, so these two crates are the whole toolchain.
# `default-features = false` on purpose: zip's defaults pull bzip2/zstd/lzma
# (C toolchains on four release targets) and AES, none of which an OOXML part
# uses — Office writes deflate. Both MIT.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
# Attachment transport (`attachments.rs`): bytes move through Rust, not the
# webview — no bucket CORS, no `connect-src` to widen for a self-hosted MinIO,
# and a 500 MB video never enters the JS heap.
#
# reqwest is ALREADY in the tree via `tauri-plugin-updater`; these are exactly
# the features it already turns on (`cargo tree -i reqwest -e features`:
# json/stream/rustls-no-provider), so this is the same single copy rather than a
# second one. `default-features = false` is load-bearing — reqwest's defaults
# pull native-tls/openssl, which nothing here builds today. `rustls-no-provider`
# leaves the crypto provider to rustls' own crate features (ring), which is what
# the updater already relies on; `stream` is what lets a request body be a file
# read incrementally instead of a Vec.
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "rustls-no-provider",
] }
# Async file I/O for the same streaming path. Both are already in the tree under
# reqwest/hyper; naming them here only makes the dependency honest.
tokio = { version = "1", default-features = false, features = ["fs", "io-util"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

# The updater is desktop-only — gate it so mobile targets don't try to build it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[dev-dependencies]
tempfile = "3"
# A current-thread runtime for the async transport tests (`attachments.rs`).
# Deliberately NOT the `macros` feature: `#[tokio::test]` would pull
# `tokio-macros` and a second `syn` into the lockfile for two tests that a
# three-line `block_on` helper covers.
tokio = { version = "1", features = ["rt"] }

# There is no workspace Cargo.toml above this crate, so this is the only place a
# release profile can go. Cargo's defaults build the shipped binary with no LTO
# and 16 codegen units; `tauri build` (both release workflows) picks this up
# automatically, no CI change.
#
# Deliberately NO `panic = "abort"`. This crate does `.lock().unwrap()`
# throughout and the process holds CRDT updates the bridge has not egested yet,
# so turning a poisoned-mutex panic into a process kill costs the user data;
# `rusqlite` also relies on `catch_unwind` in the callback paths (inert today,
# a landmine for whoever registers a custom collation or busy handler), and
# `cargo test --release` would stop supporting `#[should_panic]`. The win from
# abort is binary size, not startup latency.
[profile.release]
opt-level = 3
# "thin" rather than "fat": most of the win at a fraction of the link time, and
# a release links four targets. Measure before going fat.
lto = "thin"
codegen-units = 1
strip = true
